name: Website

# Builds site/ (and the user guide in docs/guide) with scripts/build-site.sh and publishes it on GitHub Pages
# (https://davidlago.github.io/music-library/). Pull requests only build it.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - docs/guide/**
      - Resources/AppIcon-1024.png
      - scripts/build-site.sh
      - scripts/render-docs.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - docs/screenshots/**
      - docs/guide/**
      - Resources/AppIcon-1024.png
      - scripts/build-site.sh
      - scripts/render-docs.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Google's own static cwebp, pinned and checksummed, instead of apt: the runners' Ubuntu mirror
      # (azure.archive.ubuntu.com) can be unreachable for hours, which failed this job before anything was built.
      - name: Install cwebp
        env:
          WEBP_VERSION: "1.6.0"
          WEBP_SHA256: 1c5ffab71efecefa0e3c23516c3a3a1dccb45cc310ae1095c6f14ae268e38067
        run: |
          archive="libwebp-$WEBP_VERSION-linux-x86-64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/$archive"
          echo "$WEBP_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/libwebp-$WEBP_VERSION-linux-x86-64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/libwebp-$WEBP_VERSION-linux-x86-64/bin/cwebp" -version

      - name: Build
        run: scripts/build-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
