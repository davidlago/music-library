name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "iPhone app: sign it for TestFlight without uploading (export), or upload it (upload)"
        type: choice
        options: [none, export, upload]
        default: none

permissions:
  contents: read

env:
  # The release Xcode that builds the iPhone app (scripts/select-xcode.sh). App Store Connect refuses builds made with a
  # beta Xcode, so it's pinned: when Apple ships a new release Xcode and the xcode-27 image has it, update this.
  RELEASE_XCODE: "27.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Install ffmpeg
        # The tests make their audio with it; the app gets its own copy below.
        run: brew install ffmpeg

      - name: Build
        run: swift build

      - name: Restore the app's ffmpeg, ffprobe and fpcalc
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-${{ hashFiles('scripts/build-tools.sh') }}-universal

      - name: Build the app's ffmpeg, ffprobe and fpcalc (Apple Silicon + Intel)
        env:
          UNIVERSAL: "1"
        run: scripts/build-tools.sh

      - name: Test
        run: swift test

      - name: Test with the app's ffmpeg, ffprobe and fpcalc
        run: MUSICLIB_TOOLS_DIR="$PWD/build/tools" swift test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Releases are signed with the Developer ID certificate and notarized; other builds are signed ad hoc.
      - name: Import the Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          identity="$(scripts/import-certificate.sh "Developer ID Application")"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Optional: with a Developer ID profile that has iCloud the release is built for iCloud (its own bundle ID);
      # without one, exactly as before (docs/distribution.md).
      - name: Install the Mac provisioning profile
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$PROFILE" ]; then
            printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/MusicLibrary.provisionprofile"
            echo "PROVISIONING_PROFILE=$RUNNER_TEMP/MusicLibrary.provisionprofile" >> "$GITHUB_ENV"
          fi

      - name: Build app (Apple Silicon + Intel)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          UNIVERSAL: "1"
        run: scripts/build-app.sh

      - name: Notarize
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY"
          scripts/notarize.sh
          rm -f "$NOTARY_KEY"

      - name: Remove the signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Package
        id: package
        run: |
          name="MusicLibrary-${{ steps.version.outputs.version }}-macOS.zip"
          ditto -c -k --keepParent build/MusicLibrary.app "$name"
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: MusicLibrary-macOS
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

  ios:
    name: Build for iOS
    # The iPhone app runs on iOS 26 but uses iOS 27 APIs where available, so it needs the iOS 27 SDK: Xcode 27 (GitHub's `xcode-27` image, in preview).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select the release Xcode
        run: scripts/select-xcode.sh

      - name: Build MusicLibraryCore for iOS
        run: xcodebuild -scheme MusicLibraryCore -destination 'generic/platform=iOS Simulator' build

      - name: Build the iPhone app
        # With the iCloud entitlements, so the file and its build settings are checked too.
        run: xcodebuild -project iOS/MusicLibraryMobile.xcodeproj -scheme MusicLibraryMobile -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO APP_ENTITLEMENTS=MusicLibraryMobile.entitlements build

  testflight:
    name: Upload the iPhone app to TestFlight
    # Every release tag; by hand with the workflow's "testflight" input.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testflight != 'none')
    needs: [build, ios]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select the release Xcode
        run: scripts/select-xcode.sh

      # An App Manager API key can't use cloud-managed signing, so the Apple Distribution certificate comes from a
      # secret; with the key, testflight.sh makes App Store profiles for it (scripts/provisioning-profiles.swift),
      # signs manually and uploads.
      - name: Import the Apple Distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          identity="$(scripts/import-certificate.sh "Apple Distribution")"
          # The team is the identity's last part: "Apple Distribution: Name (TEAMID)".
          team="$(sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p' <<< "$identity")"
          [ -n "$team" ] || { echo "::error::No team ID in \"$identity\""; exit 1; }
          echo "DEVELOPMENT_TEAM=$team" >> "$GITHUB_ENV"

      - name: Archive and upload
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
          ASC_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          UPLOAD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.testflight == 'upload') && '1' || '0' }}
          # The repository variable ICLOUD=1 once the App ID has iCloud (docs/distribution.md).
          ICLOUD: ${{ vars.ICLOUD == '1' && '1' || '0' }}
        run: |
          export ASC_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$ASC_KEY"
          # Releases take their version from the tag; other runs use iOS/Version.xcconfig.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          DISTRIBUTION_CERTIFICATE=1 scripts/testflight.sh
          rm -f "$ASC_KEY"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: MusicLibrary-macOS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's new: this version's section of CHANGELOG.md, or Unreleased if it wasn't renamed before tagging.
          version="${GITHUB_REF_NAME#v}"
          section() { awk -v heading="## $1" '$0 == heading { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md; }
          changes="$(section "$version")"
          [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ] || changes="$(section Unreleased)"
          {
            if [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then
              printf '### What'"'"'s new\n%s\n\n' "$changes"
            fi
            cat <<'NOTES'
          ### Install

          Download `MusicLibrary-*-macOS.zip` below, unzip it and move **MusicLibrary.app** to Applications (Apple Silicon and Intel, macOS 14+). It's signed and notarized by Apple, and includes everything it needs (ffmpeg too).

          See the [README](https://github.com/davidlago/music-library#readme) for details, including the iPhone app.
          NOTES
          } > notes.md
          gh release create "$GITHUB_REF_NAME" MusicLibrary-*-macOS.zip MusicLibrary-*-macOS.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Music Library ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
