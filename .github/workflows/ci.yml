name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Install ffmpeg
        # The tests make their audio with it; the app gets its own copy below.
        run: brew install ffmpeg

      - name: Build
        run: swift build

      - name: Restore the app's ffmpeg, ffprobe and fpcalc
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-${{ hashFiles('scripts/build-tools.sh') }}-universal

      - name: Build the app's ffmpeg, ffprobe and fpcalc (Apple Silicon + Intel)
        env:
          UNIVERSAL: "1"
        run: scripts/build-tools.sh

      - name: Test
        run: swift test

      - name: Test with the app's ffmpeg, ffprobe and fpcalc
        run: MUSICLIB_TOOLS_DIR="$PWD/build/tools" swift test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Releases are signed with the Developer ID certificate and notarized; other builds are signed ad hoc.
      - name: Import the Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$CERTIFICATE_P12" ] || { echo "::error::The DEVELOPER_ID_CERTIFICATE_P12 secret is missing"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::The certificate has no Developer ID Application identity"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build app (Apple Silicon + Intel)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          UNIVERSAL: "1"
        run: scripts/build-app.sh

      - name: Notarize
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY"
          scripts/notarize.sh
          rm -f "$NOTARY_KEY"

      - name: Remove the signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Package
        id: package
        run: |
          name="MusicLibrary-${{ steps.version.outputs.version }}-macOS.zip"
          ditto -c -k --keepParent build/MusicLibrary.app "$name"
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: MusicLibrary-macOS
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

  ios:
    name: Build for iOS
    # The iPhone app targets iOS 27 and uses its APIs, so it needs Xcode 27 (GitHub's `xcode-27` image, in preview).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -iv beta | sort -V | tail -1 || true)"
          [ -n "$xcode" ] || xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$xcode" ] || { echo "No Xcode 27 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build MusicLibraryCore for iOS
        run: xcodebuild -scheme MusicLibraryCore -destination 'generic/platform=iOS Simulator' build

      - name: Build the iPhone app
        run: xcodebuild -project iOS/MusicLibraryMobile.xcodeproj -scheme MusicLibraryMobile -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: MusicLibrary-macOS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's new: this version's section of CHANGELOG.md, or Unreleased if it wasn't renamed before tagging.
          version="${GITHUB_REF_NAME#v}"
          section() { awk -v heading="## $1" '$0 == heading { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md; }
          changes="$(section "$version")"
          [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ] || changes="$(section Unreleased)"
          {
            if [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then
              printf '### What'"'"'s new\n%s\n\n' "$changes"
            fi
            cat <<'NOTES'
          ### Install

          Download `MusicLibrary-*-macOS.zip` below, unzip it and move **MusicLibrary.app** to Applications (Apple Silicon and Intel, macOS 14+). It's signed and notarized by Apple, and includes everything it needs (ffmpeg too).

          See the [README](https://github.com/davidlago/music-library#readme) for details, including the iPhone app.
          NOTES
          } > notes.md
          gh release create "$GITHUB_REF_NAME" MusicLibrary-*-macOS.zip MusicLibrary-*-macOS.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Music Library ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
